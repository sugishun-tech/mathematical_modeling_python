[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-modeling-lab"
version = "2.0.0"
description = "Inspectable numerical methods and verified central textbook examples"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "sympy>=1.12,<2",
  "pandas>=2,<3", "matplotlib>=3.7,<4", "statsmodels>=0.14,<1"
]

[project.optional-dependencies]
notebook = ["nbformat>=5.9,<6", "nbclient>=0.10,<1", "jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10"]
render = ["markdown-it-py>=3,<5", "playwright>=1.45,<2", "PyMuPDF>=1.24,<2", "Pillow>=10,<13"]

[tool.setuptools]
packages = ["modeling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
